<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Сварочный калькулятор</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#12141a;--card:#1c2029;--card2:#232836;--line:#2e3547;--txt:#e8ecf4;--dim:#9aa4b8;--acc:#ff8c1a;--acc2:#ffb35c;--ok:#4caf7d;--bad:#e05a5a}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;padding-bottom:86px}
.app{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:18px;margin:14px 0 8px}
.sub{color:var(--dim);font-size:14px;line-height:1.45;margin:6px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.res{background:linear-gradient(160deg,#2a1c10,#1c2029);border-color:#4a3010}
.big{font-size:38px;font-weight:800;color:var(--acc)}
.mid{font-size:22px;font-weight:700;color:var(--acc2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .card{flex:1;min-width:130px}
.lbl{color:var(--dim);font-size:13px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;font-weight:600;text-align:left;cursor:pointer;margin:6px 0}
.btn:active{background:#2c3348}
.btn.acc{background:var(--acc);color:#1a0e00;border-color:var(--acc);text-align:center}
.btn.sel{border-color:var(--acc);box-shadow:0 0 0 2px #ff8c1a55}
.btn small{display:block;color:var(--dim);font-weight:400;font-size:13px;margin-top:3px}
.chip{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card2);font-size:14px;margin:4px 6px 4px 0;cursor:pointer}
.chip.sel{background:var(--acc);color:#1a0e00;border-color:var(--acc);font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#0d0f14;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 2px 12px;z-index:10}
.tab{background:none;border:none;color:var(--dim);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 2px}
.tab .ic{font-size:20px}
.tab.on{color:var(--acc)}
input[type=range]{width:100%;height:36px;accent-color:var(--acc)}
select,input[type=number],input[type=text]{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}
.hint{background:#1a2430;border-left:3px solid var(--acc);border-radius:8px;padding:8px 10px;font-size:13px;color:#cfe0f0;margin:8px 0}
.warn{background:#2a1414;border-left:3px solid var(--bad)}
.note{color:var(--dim);font-size:12px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:600}
.hero{background:linear-gradient(160deg,#3a2410,#1c2029);border-radius:16px;padding:20px 16px;margin-bottom:12px;text-align:center}
.hero h1{margin:8px 0 4px}
.wl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.wl-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;font-size:16px;font-weight:600}
.wl-card .em{font-size:30px;display:block;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}
.del{color:var(--bad);background:none;border:none;font-size:16px;cursor:pointer;padding:4px 8px}
.logo{text-align:center;font-size:44px;padding-top:40px}
@media(min-width:500px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>

 {name:'Ресанта САИ-220',type:'ММА',amps:'до 220 А',pv:60,price:8900,note:'Простой инвертор для дома и дачи. Лёгкий, дешёвый.',

 {name:'Fubag IRMMA 200',type:'ММА',amps:'до 200 А',pv:60,price:12000,note:'Уверенный старт, стабильная дуга, хорошая комплектация.',
  oz:'https://www.ozon.ru/search/?text=Fubag%20IRMMA%20200',wb:'https://www.wildberries.ru/catalog/0/search.aspx?search=Fubag%20IRMMA%20200'},

 {name:'Aurora ADONIS 200 AC/DC',type:'TIG',amps:'до 200 А',pv:35,price:48000,note:'Аргонодуговая AC/DC: алюминий, нержавейка, медь — топ для TIG.',

];

 [3,'4 мм','толщина 3 — катет 4'],

var state={page:'simple',metal:null,method:'mma',th:3,hints:true};
function loadState(){
 try{var s=JSON.parse(localStorage.getItem('weldCalc')||'{}');if(s&&s.hints!==undefined)state=s;}catch(e){}
}
function saveState(){try{localStorage.setItem('weldCalc',JSON.stringify(state));}catch(e){}}
function getMetal(){for(var i=0;i<METALS.length;i++){if(METALS[i].id===state.metal)return METALS[i];}return null;}
function getMethod(){for(var i=0;i<METHODS.length;i++){if(METHODS[i].id===state.method)return METHODS[i];}return null;}
function pickDiam(method,t){
 var table=method==='mma'?TDIAM_MMA:(method==='mig'?TDIAM_MIG:TDIAM_TIG);
 for(var i=0;i<table.length;i++){if(t<=table[i][0])return String(table[i][1]);}
 return String(table[table.length-1][1]);
}
function h(html){return '<div class="hint">'+html+'</div>';}
function hintBox(txt){return state.hints?h('💡 '+txt):'';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- ПРИВЕТСТВИЕ НОВИЧКА ---------- */
function showWelcome(){
 var c=METALS.map(function(m){return '<div class="wl-card" onclick="pickMetal(\''+m.id+'\')"><span class="em">'+m.em+'</span>'+m.name+'</div>';}).join('');
 return '<div class="hero"><div class="em" style="font-size:40px">🔥</div>'+
 '<h1>Сварочный калькулятор</h1><div class="sub">Всё о сварке: режимы, катеты, аппараты, дефекты, деньги</div></div>'+

 '<div class="note">Расчёты примерные: всегда проверяй режим на пробной пластине.</div>';
}
function pickMetal(id){state.metal=id;state.page='simple';saveState();render();}
function skipWelcome(){state.metal=state.metal||'steel';state.page='simple';saveState();render();}

 if(!m)return showWelcome();

 var canMig=m.id!=='cast'&&m.id!=='galv'?true:(m.id==='cast'?false:true);
 if(m.id==='cast'&&state.method==='mig')canMig=false;
 if(m.id==='cast'&&state.method==='tig')canMig=false;

 }).join('');
 var out=
 '<div class="card res"><div class="lbl">Металл: '+m.em+' '+m.name+' · Способ: '+meth.name+'</div>'+

function setMethod(id){state.method=id;saveState();render();}
function setTh(v){state.th=Math.max(1,Math.min(20,parseInt(v,10)||1));saveState();render();}

/* ---------- ВКЛАДКА РАСЧЁТ (ЭКСПЕРТ) ---------- */
function renderCalc(){
 var m=getMetal();if(!m)return showWelcome();
 var tdiam=pickDiam(state.method,state.th);
 var r=(state.method==='mma'?CUR_MMA:(state.method==='mig'?CUR_MIG:CUR_TIG))[tdiam]||[0,0];
 var pf=posF[state.pos]||1;
 var lo=Math.round(r[0]*m.cur*pf),hi=Math.round(r[1]*m.cur*pf);
 state.pos=state.pos||'flat';
 var posF={'flat':1,'vert':0.9,'ceil':0.85};
 var posL={'flat':'Нижнее — оптимально','vert':'Вертикаль — минус 10% тока','ceil':'Потолок — минус 15% тока'};
 var d={
  electrode:'Ø '+tdiam+' мм'+(state.method==='mig'?' проволока':' электрод'),
  current:lo+'–'+hi+' А',
  gas:state.method==='mma'?'—':(state.method==='mig'?'12–15 л/мин '+m.gas:'8–12 л/мин аргон'),
  speed:state.method==='mma'?'15–20 см/мин':(state.method==='mig'?'30–45 см/мин':'10–15 см/мин'),
  metal:m.mma.join(', '),
  weave:state.th>6?'узкий валик, без поперечных колебаний':'лёгкие колебания допустимы'
 };
 var lenPerElec=state.method==='mma'?0.28:(state.method==='mig'?4.0:2.5);
 var area=state.th*state.th/2;
 var mass=Math.round(7.85*area/100*100)/100;
 var out='<h1>Расчёт</h1>'+
 '<div class="card res"><div class="lbl">Металл: '+m.em+' '+m.name+' · '+getMethod().name+'</div>'+
 '<table>'+
 '<tr><td>Диаметр</td><td class="mid">'+d.electrode+'</td></tr>'+
 '<tr><td>Ток</td><td class="mid">'+d.current+'</td></tr>'+
 '<tr><td>Газ</td><td>'+d.gas+'</td></tr>'+
 '<tr><td>Скорость шва</td><td>'+d.speed+'</td></tr>'+
 '<tr><td>Материал</td><td>'+esc(d.metal)+'</td></tr>'+
 '<tr><td>Характер валика</td><td>'+d.weave+'</td></tr>'+
 '</table>'+hintBox('Диапазон — норма по диаметру. Вертикаль и потолок: возьми нижнюю границу или минус 10-15%.')+
 '</div>'+
 '<div class="card"><h2>Положение шва</h2>'+
 ['flat','vert','ceil'].map(function(p){return '<div class="chip'+(state.pos===p?' sel':'')+'" onclick="setPos(\''+p+'\')">'+({flat:'Нижнее',vert:'Вертикаль',ceil:'Потолок'})[p]+'</div>';}).join('')+
 '<div class="sub">'+posL[state.pos]+'</div>'+

 '</div>'+
 '<div class="card"><h2>Материальный расчёт</h2><table>'+
 '<tr><td>Длина шва с одного электрода</td><td>~'+lenPerElec+' м</td></tr>'+

 return out;
}
function setPos(p){state.pos=p;saveState();render();}

/* ---------- ВКЛАДКА АППАРАТЫ ---------- */
function renderMachines(){
 var m=getMetal();var need=(m&&m.id==='alum')?'AC/DC':(m&&m.id!=='steel'&&m.id!=='galv'?(m.id==='inox'?'любой':'TIG'):'');
 var rows=MACHINES.map(function(x){
  var fit='✔';
  if(need==='AC/DC'&&x.type.indexOf('AC/DC')<0)fit='—';
  if(m&&(m.id==='cast')&&x.type==='Полуавтомат')fit='—';
  var btns='<a class="chip" href="'+x.oz+'" target="_blank" rel="noopener">Ozon</a>'+
           '<a class="chip" href="'+x.wb+'" target="_blank" rel="noopener">WB</a>'+
           '<a class="chip" href="https://www.vseinstrumenti.ru/search/?q='+encodeURIComponent(x.name)+'" target="_blank" rel="noopener">ВсеИнструменты</a>';
  return '<div class="card"><b>'+x.name+'</b><div class="lbl">'+x.type+' · '+x.amps+' · ПВ '+x.pv+'% · ~'+x.price+' ₽</div>'+
  '<div class="sub">'+x.note+(fit==='—'?' <span style="color:var(--bad)">Для выбранного металла не лучший выбор.</span>':'')+'</div>'+btns+'</div>';
 }).join('');
 return '<h1>Аппараты</h1>'+
 hintBox('ПВ (продолжительность включения) — сколько времени аппарат может варить без паузы: 60% = 6 минут из 10.')+
 '<div class="card">'+(need?'<b>Под твой металл ('+(getMetal()?getMetal().name:'')+')</b> нужен аппарат: '+need+'.':'Для стали обычной подойдёт любой ММА-инвертор.')+'</div>'+rows;
}

/* ---------- ВКЛАДКА КАТЕТ ---------- */
function renderCatet(){
 var rows=CATET.map(function(c){return '<tr><td>'+c[0]+' мм</td><td><b>'+c[1]+'</b></td><td>'+c[2]+'</td></tr>';}).join('');
 var t=state.th;
 var kmin=Math.max(3,Math.round(t*0.9));
 var kmax=Math.round(t*1.2);
 return '<h1>Катет углового шва</h1>'+
 '<div class="card res"><div class="lbl">Для твоей толщины '+t+' мм</div>'+
 '<div class="mid">Рекомендация: '+kmin+'–'+(kmax<kmin?kmin:kmax)+' мм</div>'+
 hintBox('Катет — это сторона условного треугольника шва в углу. Слишком мал — шов слабый; слишком велик — металл коробится и расход растёт.')+
 '</div>'+
 '<div class="card"><table><tr><th>Толщина, мм</th><th>Катет</th><th>Комментарий</th></tr>'+rows+'</table>'+
 '<div class="note">Ориентировочная таблица для угловых швов. Для несущих конструкций — по СП 16.13330 и чертежу.</div></div>'+
 '<div class="card"><h2>Как измерить катет</h2><div class="sub">Приложи угольник или шаблон-катетомер к шву: сторона в шве и есть катет. Меньше нормы — доварить, больше — не страшно, но перерасход.</div></div>';
}

/* ---------- ВКЛАДКА ДЕФЕКТЫ ---------- */
function renderDefects(){
 var rows=DEFECTS.map(function(d){
  return '<div class="card"><b>'+d.n+'</b><div class="lbl" style="margin-top:6px">Причина</div><div class="sub">'+d.cause+'</div>'+
  '<div class="lbl">Что делать</div><div class="sub">'+d.fix+'</div></div>';
 }).join('');
 return '<h1>Дефекты шва</h1>'+
 hintBox('Нашёл дефект — найди причину здесь и довари участок. Большинство проблем — грязь, ток или скорость.')+rows;
}

/* ---------- ВКЛАДКА РАСЦЕНКИ ---------- */
function renderRates(){
 if(!state.rates)state.rates={hour:2000,elec:200,wire:320,co2:1100,ar:1800};
 var r=state.rates;
 var areaK=state.th*state.th/2;
 var massPerM=7.85*areaK/100;
 var elecPerKg=45;
 var costMMA=massPerM*elecPerKg*r.elec;
 var costMIG=massPerM*1.15*r.wire;
 var gasCostMIG=r.co2/12000*15*(state.method==='mig'?1:0);
 var materials=Math.round(costMMA);
 var out='<h1>Расценки и деньги</h1>'+
 '<div class="card"><h2>Мои расценки (можно менять)</h2>'+
 '<div class="lbl">Час работы, ₽</div><input type="number" value="'+r.hour+'" onchange="setRate(\'hour\',this.value)">'+
 '<div class="lbl" style="margin-top:6px">Электроды, ₽/кг</div><input type="number" value="'+r.elec+'" onchange="setRate(\'elec\',this.value)">'+
 '<div class="lbl" style="margin-top:6px">Проволока, ₽/кг</div><input type="number" value="'+r.wire+'" onchange="setRate(\'wire\',this.value)">'+
 '<div class="lbl" style="margin-top:6px">Баллон CO2 40 л, ₽</div><input type="number" value="'+r.co2+'" onchange="setRate(\'co2\',this.value)">'+
 '<div class="lbl" style="margin-top:6px">Баллон аргона 40 л, ₽</div><input type="number" value="'+r.ar+'" onchange="setRate(\'ar\',this.value)">'+
 '</div>'+
 '<div class="card res"><h2>Стоимость 1 метра шва (MMA, '+state.th+' мм)</h2>'+
 '<div class="mid">~'+materials+' ₽ материалов</div>'+
 '<div class="sub">Время на метр: ~'+Math.round(100/17)+' мин → работа ~'+Math.round(r.hour*6/60)+' ₽. Итого примерно <b>'+(materials+Math.round(r.hour*6/60))+' ₽/м</b>.</div>'+
 hintBox('Расчёт ориентиром: реальная скорость зависит от положения и опыта. Свои цифры правь в полях выше.')+
 '</div>'+
 '<div class="card"><div class="btn acc" onclick="saveHist()">💾 Сохранить в историю</div></div>';
 return out;
}
function setRate(k,v){v=parseFloat(v)||0;state.rates[k]=v;saveState();render();}

/* ---------- ИСТОРИЯ ---------- */
function getHist(){try{return JSON.parse(localStorage.getItem('weldHist')||'[]');}catch(e){return [];}}
function saveHist(){
 var m=getMetal();if(!m)return;
 var e={ts:Date.now(),metal:m.name,method:getMethod().name,th:state.th,
  diam:pickDiam(state.method,state.th),
  cur:CUR_SIMPLE[state.method][pickDiam(state.method,state.th)]||0};
 if(state.method==='mig'){e.cur=CUR_SIMPLE.mig[e.diam]||0;}
 var h=getHist();h.unshift(e);if(h.length>200)h.pop();
 try{localStorage.setItem('weldHist',JSON.stringify(h));}catch(err){}
 render();
}
function delHist(i){var h=getHist();h.splice(i,1);try{localStorage.setItem('weldHist',JSON.stringify(h));}catch(e){}render();}
function renderHistory(){
 var h=getHist();
 if(!h.length)return '<h1>История</h1><div class="card sub">Пока пусто. Сделай расчёт и нажми «Сохранить в историю».</div>';
 var rows=h.map(function(x,i){
  var d=new Date(x.ts);var s=('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  return '<tr><td>'+s+'</td><td>'+x.metal+'</td><td>'+x.method+'</td><td>'+x.th+' мм</td><td>Ø'+x.diam+'</td><td><b>'+x.cur+' А</b></td><td><button class="del" onclick="delHist('+i+')">✕</button></td></tr>';
 }).join('');
 var csv='Дата;Металл;Способ;Толщина;Диаметр;Ток\n'+h.map(function(x){var d=new Date(x.ts);return d.toLocaleString('ru-RU')+';'+x.metal+';'+x.method+';'+x.th+' мм;Ø'+x.diam+';'+x.cur+' А';}).join('\n');
 return '<h1>История расчётов</h1><div class="card"><table><tr><th>Дата</th><th>Металл</th><th>Способ</th><th>Толщ.</th><th>Ø</th><th>Ток</th><th></th></tr>'+rows+'</table>'+
 '<a class="btn" href="data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv)+'" download="weld_history.csv">⬇ Скачать CSV</a></div>';
}

/* ---------- НАВИГАЦИЯ И ЗАПУСК ---------- */
var TABS=[
 {id:'simple',ic:'🏠',name:'Простой'},
 {id:'calc',ic:'⚡',name:'Расчёт'},
 {id:'machines',ic:'🔧',name:'Аппараты'},
 {id:'catet',ic:'📐',name:'Катет'},
 {id:'defects',ic:'🔍',name:'Дефекты'},
 {id:'rates',ic:'💰',name:'Деньги'},
 {id:'history',ic:'📜',name:'История'}
];
function render(){
 var tabs=TABS.map(function(t){
  return '<button class="tab'+(state.page===t.id?' on':'')+'" onclick="goPage(\''+t.id+'\')"><span class="ic">'+t.ic+'</span>'+t.name+'</button>';
 }).join('');
 document.getElementById('tabs').innerHTML=tabs;
 var fn={'simple':renderSimple,'calc':renderCalc,'machines':renderMachines,'catet':renderCatet,'defects':renderDefects,'rates':renderRates,'history':renderHistory};
 document.getElementById('app').innerHTML=(fn[state.page]||renderSimple)();
}
function goPage(id){state.page=id;saveState();render();}
function toggleHints(el){state.hints=el.checked;saveState();render();}

loadState();
render();
<script>
 const regionPriceRanges = {
    'crimea': { butt_simple: '800–1200 ₽', frame_assembly: '1100–1800 ₽', stainless: '×1.8–2.2' },
    'moscow': { butt_simple: '1200–2000 ₽', frame_assembly: '1800–3000 ₽', stainless: '×1.8–2.2' },
    'spb': { butt_simple: '1000–1700 ₽', frame_assembly: '1500–2500 ₽', stainless: '×1.8–2.2' },
    'krasnodar': { butt_simple: '900–1400 ₽', frame_assembly: '1300–2100 ₽', stainless: '×1.8–2.2' },
    'ural': { butt_simple: '900–1300 ₽', frame_assembly: '1200–1900 ₽', stainless: '×1.8–2.2' },
    'siberia': { butt_simple: '850–1300 ₽', frame_assembly: '1100–1800 ₽', stainless: '×1.8–2.2' },
    'other': { butt_simple: '800–1500 ₽', frame_assembly: '1000–2000 ₽', stainless: '×1.8–2.2' }
  };
 
  function showPrices() {
    const region = 'crimea'; // По умолчанию Крым, так как выбора региона в текущей форме нет
    const data = regionPriceRanges[region];
    
    let block = document.getElementById('price-hint-block');
    if (!block) {
      block = document.createElement('div');
      block.id = 'price-hint-block';
      // Стили для красивого блока с ценами
      block.style.cssText = "margin: 20px 0; padding: 15px; background: #e3f2fd; border-radius: 8px; border-left: 5px solid #2196F3; font-family: sans-serif; color: #333;";
      
      // Пытаемся вставить блок сразу после основного контейнера #app
      const app = document.getElementById('app');
      if (app) app.after(block);
      else document.body.appendChild(block);
    }

    block.innerHTML = `
      <strong>Средние цены (ориентир для Крыма):</strong><br>
      • Стыковой шов (простой): \${data.butt_simple}<br>
      • Сборка каркаса/рамы: \${data.frame_assembly}<br>
      • Нержавейка/Алюминий: коэффициент \${data.stainless}
      <br><small style="color:#666; display:block; margin-top:8px;">Цены ориентировочные, зависят от сложности и доступа к месту работ.</small>
    `;
  }
// Создаем кнопку, если её ещё нет
if (!document.getElementById('btn-prices-auto')) {
  const btn = document.createElement('button');
  btn.id = 'btn-prices-auto';
  
  // Твои идеальные строки со стилями и текстом
  btn.innerText = '🗺️ Средние цены по региону';
  btn.style.cssText = "padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; margin-top: 10px;";
  btn.onclick = showPrices;

  // Логика вставки кнопки: ищем последнее поле ввода на странице
  const inputs = document.querySelectorAll('input, select, textarea');
  
  if (inputs.length > 0) {
    // Вставляем кнопку сразу после последнего поля ввода
    inputs[inputs.length - 1].parentNode.appendChild(btn);
  } else {
    // Если полей нет, кидаем кнопку в самый низ страницы
    document.body.appendChild(btn);
  }
}

  
  }</script>
